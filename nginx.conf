server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The dev bind mount exposes the whole project directory, so keep
    # dotfiles and infrastructure files out of the served site.
    location ~ /\. {
        deny all;
    }

    location ~* ^/(nginx\.conf|Dockerfile|docker-compose\.yml)$ {
        deny all;
    }

    # Static site with no build step: never let the browser reuse a stale
    # index.html or ES module after an edit.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        etag off;
    }
}
